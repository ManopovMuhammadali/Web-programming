<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 12 Sprint Quiz</title><link rel="stylesheet" href="../site.css"><link rel="stylesheet" href="../weeks.css"><style>main{max-width:850px;margin:4rem auto;padding:1.5rem}.card{padding:1rem;margin:1rem 0;border:1px solid #888;border-radius:1rem}label{display:block;margin:.6rem 0}</style></head>
<body><header class="site-nav"><a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a><a class="nav-link" href="index.html">← Week 12</a></header><main><h1>React State &amp; Effects Sprint Quiz</h1><p>Choose one answer per question, then check your score.</p><form id="quiz"><fieldset class="card"><legend>1. useState returns:</legend><label><input type="radio" name="q1" value="a"> A value and a setter</label><label><input type="radio" name="q1" value="b"> A DOM node</label></fieldset><fieldset class="card"><legend>2. Update state arrays by:</legend><label><input type="radio" name="q2" value="a"> Mutating with push()</label><label><input type="radio" name="q2" value="b"> Returning a new array with map/filter/spread</label></fieldset><fieldset class="card"><legend>3. Shared state belongs in:</legend><label><input type="radio" name="q3" value="a"> The nearest common parent</label><label><input type="radio" name="q3" value="b"> A global variable</label></fieldset><fieldset class="card"><legend>4. Effect dependencies control:</legend><label><input type="radio" name="q4" value="a"> CSS selection</label><label><input type="radio" name="q4" value="b"> When the effect re-synchronizes</label></fieldset><fieldset class="card"><legend>5. Fetch cleanup should:</legend><label><input type="radio" name="q5" value="a"> Ignore or abort stale requests</label><label><input type="radio" name="q5" value="b"> Keep stale responses as current</label></fieldset><button>Check answers</button><p id="result" aria-live="polite"></p></form></main><script>document.querySelector("#quiz").addEventListener("submit",e=>{e.preventDefault();const a={q1:"a",q2:"b",q3:"a",q4:"b",q5:"a"};const f=new FormData(e.currentTarget);const n=Object.entries(a).filter(([q,v])=>f.get(q)===v).length;document.querySelector("#result").textContent=`Score: ${n} / 5`})</script></body></html>
