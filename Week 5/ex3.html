<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Counter — Week 5</title>
  <link rel="stylesheet" href="exercises.css">
</head>
<body>
  <header class="site-nav">
    <a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a>
    <a class="nav-link" href="index.html">← Week 5</a>
  </header>

  <main>
    <div class="page-meta">
      <span>Web Programming</span>
      <span>Week 05 / Exercise 03</span>
    </div>
    <h1>Interactive counter.</h1>
    <p class="intro">Use the buttons to change the count.</p>

    <section class="exercise-card">
      <div class="counter-value" id="count" aria-live="polite">0</div>

      <div class="button-row">
        <button class="button-secondary" type="button"
                id="subtract">− Subtract</button>
        <button type="button" id="add">+ Add</button>
        <button class="button-secondary" type="button"
                id="reset">Reset</button>
      </div>
    </section>

    <a class="back-link" href="index.html">← Back to Week 5 exercises</a>
  </main>

  <footer class="site-footer">
    <p>MM / Web Programming Portfolio</p>
    <p><a href="../index.html">Return to homepage ↑</a></p>
  </footer>

  <script>
    let count = 0;
    const countEl = document.getElementById('count');

    function updateCount() {
      countEl.textContent = count;
    }

    document.getElementById('subtract').addEventListener('click', () => {
      count--;
      updateCount();
    });

    document.getElementById('add').addEventListener('click', () => {
      count++;
      updateCount();
    });

    document.getElementById('reset').addEventListener('click', () => {
      count = 0;
      updateCount();
    });
  </script>
</body>
</html>
