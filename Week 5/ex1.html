<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Calculator — Week 5</title>
  <link rel="stylesheet" href="exercises.css">
</head>
<body>
  <header class="site-nav">
    <a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a>
    <a class="nav-link" href="index.html">← Week 5</a>
  </header>

  <main>
    <div class="page-meta">
      <span>Web Programming</span>
      <span>Week 05 / Exercise 01</span>
    </div>
    <h1>Grade calculator.</h1>
    <p class="intro">Enter your score to calculate your letter grade.</p>

    <section class="exercise-card">
      <label for="score">Score (0–100)</label>
      <div class="form-row">
        <div class="field">
          <input id="score" type="number" min="0" max="100"
                 placeholder="e.g. 75">
        </div>
        <button id="go" type="button">Get grade ↗</button>
      </div>

      <div class="result" aria-live="polite">
        <div class="result-value" id="grade"></div>
        <div class="result-note" id="note"></div>
      </div>
    </section>

    <a class="back-link" href="index.html">← Back to Week 5 exercises</a>
  </main>

  <footer class="site-footer">
    <p>MM / Web Programming Portfolio</p>
    <p><a href="../index.html">Return to homepage ↑</a></p>
  </footer>

  <script>
    function getGrade(score) {
      if (score >= 90) return 'A';
      if (score >= 80) return 'B';
      if (score >= 70) return 'C';
      if (score >= 60) return 'D';
      return 'F';
    }

    const input = document.getElementById('score');
    const gradeEl = document.getElementById('grade');
    const noteEl = document.getElementById('note');

    function show() {
      const raw = input.value.trim();
      const score = Number(raw);

      noteEl.className = 'result-note';

      if (raw === '' || !Number.isFinite(score) ||
          score < 0 || score > 100) {
        gradeEl.textContent = '';
        noteEl.textContent = 'Enter a number between 0 and 100.';
        noteEl.classList.add('error');
        return;
      }

      gradeEl.textContent = 'Grade: ' + getGrade(score);
      noteEl.textContent = 'Your score is ' + score + ' out of 100.';
    }

    document.getElementById('go').addEventListener('click', show);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') show();
    });
  </script>
</body>
</html>
