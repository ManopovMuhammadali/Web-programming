
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Advanced Portfolio — Muhammadali</title>
<link rel="stylesheet" href="../portfolio.css">

<style>
:root {
  --primary: #24434a;
  --accent: #b87b35;
  --bg: #f5f7f5;
  --text: #17242b;
}

* {
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  margin: 0;
}

.demo-nav {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #24434a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5%;
  gap: 20px;
}

.demo-nav strong {
  color: white;
}

.demo-nav a {
  color: #f4dfc4;
  text-decoration: none;
  margin-left: 18px;
}

.hero {
  padding: 90px 22px 65px;
  text-align: center;
  background: linear-gradient(135deg, #f5f7f5, #efe4d3);
}

.hero h1 {
  font-size: clamp(34px, 6vw, 60px);
  margin: 0 0 12px;
  color: var(--primary);
  animation: fadeIn 1s ease;
}

.hero p {
  color: #607079;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.skills {
  max-width: 1050px;
  margin: auto;
  padding: 25px 22px 70px;
}

.skills h2 {
  position: sticky;
  top: 55px;
  background: var(--bg);
  padding: 14px 0;
  border-bottom: 3px solid var(--accent);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border: 1px solid #dbe3e5;
  border-radius: 12px;
  padding: 24px;
  font-weight: 650;
  transition: transform .2s, box-shadow .2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px #24434a18;
}

.card span {
  display: block;
  font-size: 1.8rem;
  margin-bottom: 9px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<nav class="demo-nav">
  <strong>Muhammadali Manopov</strong>
  <div>
    <a href="#home">Home</a>
    <a href="#skills">Skills</a>
    <a href="../index.html">Portfolio</a>
  </div>
</nav>

<header class="hero" id="home">
  <h1>Hello, I am Muhammadali.</h1>
  <p>AI Software Engineering · Gachon University · Week 3 CSS Advanced</p>
</header>

<main class="skills" id="skills">
  <h2>Skills I am learning</h2>

  <div class="grid">
    <div class="card"><span>🌐</span>HTML5</div>
    <div class="card"><span>🎨</span>CSS3</div>
    <div class="card"><span>⚡</span>JavaScript</div>
    <div class="card"><span>🐍</span>Python</div>
    <div class="card"><span>▦</span>CSS Grid</div>
    <div class="card"><span>📱</span>Responsive Design</div>
  </div>
</main>

<footer class="site-footer">
  <span>© 2026 Muhammadali Manopov</span>
  <a href="../index.html">Back to portfolio</a>
</footer>

</body>
</html>
