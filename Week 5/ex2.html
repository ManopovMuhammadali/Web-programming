 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Loops — Week 5</title>
<link rel="stylesheet" href="../portfolio.css">
<style>
.card {
  max-width: 650px;
  margin: 40px auto;
  padding: 28px;
  background: white;
  border: 1px solid #dbe3e5;
  border-radius: 12px;
}
button {
  padding: 11px 18px;
  cursor: pointer;
}
#output {
  margin-top: 20px;
  line-height: 1.8;
}
</style>
</head>
<body>
<header class="site-nav">
  <a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a>
  <a class="nav-link" href="index.html">← Week 5</a>
</header>

<main>
<section class="card">
  <p>WEEK 05 / EXERCISE 01</p>
  <h1>Fruit Loops</h1>
  <p>
    This exercise uses a loop and conditional statements.
    Multiples of 3 display Fruit, multiples of 5 display Loops,
    and multiples of both display Fruit Loops.
  </p>
  <button id="runButton" type="button">Run Fruit Loops</button>
  <ol id="output"></ol>
</section>
</main>

<script>
document.getElementById("runButton").addEventListener("click", () => {
  const output = document.getElementById("output");
  output.replaceChildren();

  for (let number = 1; number <= 30; number++) {
    let result = String(number);

    if (number % 3 === 0 && number % 5 === 0) {
      result = "Fruit Loops";
    } else if (number % 3 === 0) {
      result = "Fruit";
    } else if (number % 5 === 0) {
      result = "Loops";
    }

    const item = document.createElement("li");
    item.textContent = result;
    output.appendChild(item);
  }
});
</script>
</body>
</html>
