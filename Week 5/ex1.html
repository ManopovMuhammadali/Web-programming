
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Calculator</title>
  <link rel="stylesheet" href="../portfolio.css">
  <style>
    .task-card { max-width: 620px; margin: 50px auto; padding: 32px; background: white; border: 1px solid #dbe3e5; border-radius: 12px; }
    label { display: block; margin: 18px 0 8px; color: #24434a; }
    input { width: 100%; padding: 12px; border: 1px solid #dbe3e5; border-radius: 7px; font: inherit; }
    button { margin-top: 20px; padding: 12px 20px; background: #24434a; color: white; border: 0; border-radius: 7px; cursor: pointer; }
    #result { margin-top: 22px; color: #24434a; font-weight: bold; }
  </style>
</head>
<body>
  <header class="site-nav">
    <a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a>
    <a class="nav-link" href="index.html">← Week 5</a>
  </header>
  <main>
    <section class="task-card">
      <p>WEEK 05 / EXERCISE 01</p>
      <h1>Grade Calculator</h1>
      <p>Enter your score to calculate your letter grade.</p>
      <label for="score">Your score (0–100)</label>
      <input id="score" type="number" min="0" max="100" placeholder="Enter your score">
      <button onclick="calculateGrade()">Calculate grade</button>
      <p id="result" aria-live="polite"></p>
    </section>
  </main>
  <script>
    function calculateGrade() {
      const score = Number(document.getElementById("score").value);
      const result = document.getElementById("result");

      if (document.getElementById("score").value === "" || score < 0 || score > 100) {
        result.textContent = "Please enter a score between 0 and 100.";
        return;
      }

      let grade;
      if (score >= 90) grade = "A";
      else if (score >= 80) grade = "B";
      else if (score >= 70) grade = "C";
      else if (score >= 60) grade = "D";
      else grade = "F";

      result.textContent = `Your grade is ${grade}.`;
    }
  </script>
</body>
</html>
