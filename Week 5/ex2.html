 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loops and Arrays</title>
  <link rel="stylesheet" href="../portfolio.css">
  <style>
    .task-card { max-width: 620px; margin: 50px auto; padding: 32px; background: white; border: 1px solid #dbe3e5; border-radius: 12px; }
    button { padding: 12px 20px; background: #24434a; color: white; border: 0; border-radius: 7px; cursor: pointer; }
    #output { margin-top: 20px; line-height: 1.9; color: #24434a; }
  </style>
</head>
<body>
  <header class="site-nav">
    <a class="wordmark" href="../index.html">MM / <span>PORTFOLIO</span></a>
    <a class="nav-link" href="index.html">← Week 5</a>
  </header>
  <main>
    <section class="task-card">
      <p>WEEK 05 / EXERCISE 02</p>
      <h1>Loops and Arrays</h1>
      <p>Use JavaScript loops to display numbers and calculate their total.</p>
      <button onclick="runLoop()">Run exercise</button>
      <div id="output" aria-live="polite"></div>
    </section>
  </main>
  <script>
    function runLoop() {
      const numbers = [5, 10, 15, 20, 25];
      let total = 0;
      let output = "<strong>Numbers:</strong><br>";

      for (let i = 0; i < numbers.length; i++) {
        output += numbers[i] + "<br>";
        total += numbers[i];
      }

      output += `<br><strong>Total: ${total}</strong>`;
      document.getElementById("output").innerHTML = output;
    }
  </script>
</body>
</html>
