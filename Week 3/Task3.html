
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Spinner — Week 3</title>
  <link rel="stylesheet" href="../portfolio.css">

  <style>
    .demo {
      min-height: 55vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 5px solid #eadfce;
      border-top-color: #b87b35;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <nav class="site-nav">
    <a class="wordmark" href="../index.html">MM / PORTFOLIO</a>
    <a class="nav-link" href="index.html">← Week 3</a>
  </nav>

  <main>
    <header class="archive-intro">
      <div class="archive-meta">
        <span>WEEK 03 · TASK 03</span>
        <span>CSS ANIMATION</span>
      </div>
      <h1>Loading spinner.</h1>
      <p>A loading indicator created using CSS borders and animation.</p>
    </header>

    <section class="demo">
      <div class="spinner"
           role="img"
           aria-label="Animated loading spinner">
      </div>
      <p>Loading demonstration</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>MM / Web Programming Portfolio</span>
    <a href="index.html">Back to Week 3</a>
  </footer>
</body>
</html>
