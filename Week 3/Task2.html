.card {
  max-width: 320px;
  margin: 60px auto;
  padding: 28px;
  color: #0f766e;
  background: white;
  border: 2px solid #14b8a6;
  border-radius: 12px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 28px rgba(15,118,110,.25);
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
