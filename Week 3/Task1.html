<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <link rel="stylesheet" href="../portfolio.css">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px;color:#0f766e;font-weight:bold">Card content here</p>
  </div>
  <div class="card">
    <img
        src="https://placehold.co/600x350?text=Web+Programming"
        alt="Web programming illustration"
    >

    <div class="card-content">
        <h2>Web Programming</h2>
        <p>
            Learn how to create websites using HTML,
            CSS and JavaScript.
        </p>
        <a href="#">Learn More</a>
    </div>
</div>

</body>
</html>
