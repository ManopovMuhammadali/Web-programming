<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 12.1 | Shopping Cart</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font:16px/1.6 system-ui;margin:0;background:#f4f7f5;color:#1b2821}main{max-width:1100px;margin:auto;padding:2rem}header,section,article{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:1.2rem;margin:1rem 0}.layout{display:grid;grid-template-columns:2fr 1fr;gap:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}img{width:100%;height:140px;object-fit:cover;border-radius:10px}button{padding:.55rem .8rem;margin:.2rem;border:0;border-radius:9px;background:#176b4d;color:white;cursor:pointer}input{padding:.55rem;border:1px solid #bccbc1;border-radius:8px}@media(max-width:720px){.layout{grid-template-columns:1fr}}</style></head><body><main><nav><a href="index.html">← Week 12</a></nav><header><small>WEB PROGRAMMING · WEEK 12_1</small><h1>Shopping cart with React state</h1><p>Immutable array updates · quantities · computed totals · promotion code · demo checkout.</p></header><div id="root"></div><footer>Muhammadali Manopov · 202537299</footer></main><script type="text/babel">const{useState}=React;const catalog=[{id:1,name:"Wireless Headphones",price:79000,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"},{id:2,name:"Desk Lamp",price:42000,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600"},{id:3,name:"Notebook",price:12000,img:"https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=600"},{id:4,name:"Travel Backpack",price:65000,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600"},{id:5,name:"Coffee Mug",price:18000,img:"https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=600"}];const won=n=>n.toLocaleString("ko-KR")+"원";
function App(){const[cart,setCart]=useState([]),[promo,setPromo]=useState(""),[applied,setApplied]=useState(false),[message,setMessage]=useState("");function add(p){setCart(a=>a.some(x=>x.id===p.id)?a.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...a,{...p,qty:1}]);setMessage("")}function qty(id,delta){setCart(a=>a.map(x=>x.id===id?{...x,qty:x.qty+delta}:x).filter(x=>x.qty>0))}const subtotal=cart.reduce((sum,x)=>sum+x.price*x.qty,0),discount=applied?Math.round(subtotal*.1):0,shipping=subtotal===0||subtotal>=100000?0:3000,total=subtotal-discount+shipping;return <div className="layout"><section><h2>Products <span aria-label="items in cart">({cart.reduce((n,x)=>n+x.qty,0)} in cart)</span></h2><div className="grid">{catalog.map(p=><article key={p.id}><img src={p.img} alt={p.name}/><h3>{p.name}</h3><p>{won(p.price)}</p><button onClick={()=>add(p)}>Add to cart</button></article>)}</div></section><section><h2>Your cart</h2>{cart.map(x=><article key={x.id}><strong>{x.name}</strong><p>{won(x.price)} × {x.qty}</p><button aria-label={"Decrease "+x.name} onClick={()=>qty(x.id,-1)}>−</button><button aria-label={"Increase "+x.name} onClick={()=>qty(x.id,1)}>+</button><button onClick={()=>setCart(a=>a.filter(y=>y.id!==x.id))}>Remove</button></article>)}{!cart.length&&<p>Your cart is empty.</p>}<form onSubmit={e=>{e.preventDefault();if(promo.trim().toUpperCase()==="WEBPRO10"){setApplied(true);setMessage("WEBPRO10 applied: 10% off.")}else setMessage("Code not recognized. Try WEBPRO10.")}}><label>Promo code <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder="WEBPRO10"/></label><button>Apply</button></form><p>Subtotal: {won(subtotal)}</p><p>Shipping: {shipping?won(shipping):"Free"} {subtotal>0&&subtotal<100000&&<small>(free over 100,000원)</small>}</p><p>Discount: −{won(discount)}</p><h3>Total: {won(total)}</h3><button disabled={!cart.length} onClick={()=>{setMessage("Demo order confirmed. No payment was taken.");setCart([]);setApplied(false);setPromo("")}}>Place demo order</button><p aria-live="polite">{message}</p></section></div>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
