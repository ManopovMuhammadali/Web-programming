<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 12.2 | React Effects & APIs</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font:16px/1.6 system-ui;margin:0;background:#f4f7f5;color:#1b2821}main{max-width:1050px;margin:auto;padding:2rem}header,section,article{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:1.2rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}button{padding:.55rem .8rem;margin:.2rem;border:0;border-radius:9px;background:#176b4d;color:white;cursor:pointer}input,select{padding:.55rem;border:1px solid #bccbc1;border-radius:8px}img{max-width:96px;border-radius:50%}.muted{color:#53645a}</style></head><body><main><nav><a href="index.html">← Week 12</a></nav><header><small>WEB PROGRAMMING · WEEK 12_2</small><h1>Effects, fetch & cleanup</h1><p>Weather forecast · GitHub profile lookup · JSONPlaceholder request · stopwatch · effect quiz.</p></header><div id="root"></div><footer>Muhammadali Manopov · 202537299</footer></main><script type="text/babel">const{useState,useEffect}=React;
function Weather(){const[city,setCity]=useState("Seoul"),[query,setQuery]=useState("Seoul"),[unit,setUnit]=useState("celsius"),[data,setData]=useState(null),[status,setStatus]=useState("Loading forecast…");useEffect(()=>{const controller=new AbortController();async function load(){try{setStatus("Loading forecast…");setData(null);const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=en&format=json",{signal:controller.signal});if(!g.ok)throw Error("City search failed");const place=(await g.json()).results?.[0];if(!place)throw Error("City not found. Try another name.");const url="https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&forecast_days=7&temperature_unit="+unit+"&timezone=auto";const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error("Forecast request failed");setData({place,...await r.json()});setStatus("")}catch(e){if(e.name!=="AbortError")setStatus(e.message)}}load();return()=>controller.abort()},[city,unit]);return <article><h2>7-day weather</h2><form onSubmit={e=>{e.preventDefault();setCity(query.trim()||"Seoul")}}><input value={query} onChange={e=>setQuery(e.target.value)} aria-label="City"/><button>Search city</button></form><label>Units <select value={unit} onChange={e=>setUnit(e.target.value)}><option value="celsius">Celsius</option><option value="fahrenheit">Fahrenheit</option></select></label><p aria-live="polite">{status}</p>{data&&<><h3>{data.place.name}, {data.place.country}</h3><p>Now: {data.current.temperature_2m}° · Wind {data.current.wind_speed_10m} km/h</p><ol>{data.daily.time.map((d,i)=><li key={d}>{d}: {data.daily.temperature_2m_min[i]}° – {data.daily.temperature_2m_max[i]}°</li>)}</ol></>}</article>}
function GitHubLookup(){const[name,setName]=useState("octocat"),[user,setUser]=useState(null),[status,setStatus]=useState("Search for a public GitHub profile.");async function search(e){e.preventDefault();const q=name.trim();if(!q)return;setStatus("Loading profile…");setUser(null);try{const r=await fetch("https://api.github.com/users/"+encodeURIComponent(q));if(r.status===404)throw Error("No profile found.");if(!r.ok)throw Error("GitHub request failed. Try again.");setUser(await r.json());setStatus("")}catch(e){setStatus(e.message)}}return <article><h2>GitHub profile search</h2><form onSubmit={search}><input value={name} onChange={e=>setName(e.target.value)} aria-label="GitHub username" placeholder="username"/><button>Search</button></form><p aria-live="polite">{status}</p>{user&&<div><img src={user.avatar_url} alt=""/><h3>{user.name||user.login}</h3><p>{user.bio}</p><p>Public repos: {user.public_repos} · Followers: {user.followers}</p><a href={user.html_url} target="_blank" rel="noreferrer">Open GitHub profile</a></div>}</article>}
function PostList(){const[posts,setPosts]=useState([]),[status,setStatus]=useState("Loading posts…");useEffect(()=>{const controller=new AbortController();fetch("https://jsonplaceholder.typicode.com/posts?_limit=5",{signal:controller.signal}).then(r=>{if(!r.ok)throw Error("Request failed");return r.json()}).then(x=>{setPosts(x);setStatus("")}).catch(e=>{if(e.name!=="AbortError")setStatus(e.message)});return()=>controller.abort()},[]);return <article><h2>Posts loaded once</h2><p aria-live="polite">{status}</p>{posts.map(p=><p key={p.id}><strong>{p.title}</strong><br/>{p.body}</p>)}</article>}
function Stopwatch(){const[seconds,setSeconds]=useState(0),[running,setRunning]=useState(false);useEffect(()=>{if(!running)return;const id=setInterval(()=>setSeconds(s=>s+1),1000);return()=>clearInterval(id)},[running]);return <article><h2>Stopwatch</h2><p>{Math.floor(seconds/60)}:{String(seconds%60).padStart(2,"0")}</p><button onClick={()=>setRunning(x=>!x)}>{running?"Pause":"Start"}</button><button onClick={()=>{setRunning(false);setSeconds(0)}}>Reset</button><p className="muted">The interval is cleaned up on pause and unmount.</p></article>}
const questions=[{q:"What is an effect for?",a:["Synchronizing with an external system","Sorting JSX","Replacing props"],c:0},{q:"When does an effect with [] run?",a:["After mount","Every render","Only on click"],c:0},{q:"What should cleanup clear?",a:["Timers and subscriptions","Component props","CSS classes"],c:0},{q:"Why abort fetch on cleanup?",a:["Avoid stale work after unmount/change","Make JSON smaller","Cache results"],c:0},{q:"What does a dependency list do?",a:["Controls when effect re-runs","Declares HTML","Creates state"],c:0},{q:"Where should a derived total usually be computed?",a:["During render from source state","In an effect","In localStorage only"],c:0},{q:"What is a loading state for?",a:["Show request progress","Retry silently","Hide errors"],c:0},{q:"How should network errors be shown?",a:["Clear, visible feedback","Ignore them","Throw from JSX"],c:0},{q:"What causes an infinite effect loop?",a:["Effect updates a dependency each run","Using a heading","Fetching JSON"],c:0},{q:"Why use a form submit handler for search?",a:["Supports button and Enter","Prevents state updates","Skips loading"],c:0},{q:"What is an interval cleanup pattern?",a:["clearInterval(id)","setInterval(null)","removeEventListener(id)"],c:0},{q:"When should document title be set?",a:["In an effect and restore in cleanup if needed","In render repeatedly","Only in CSS"],c:0}];function Quiz(){const[answers,setAnswers]=useState({}),[done,setDone]=useState(false);const score=questions.filter((q,i)=>answers[i]===q.c).length;return <article><h2>Effects quiz (12 questions)</h2>{questions.map((q,i)=><fieldset key={i}><legend>{i+1}. {q.q}</legend>{q.a.map((x,j)=><label key={j} style={{display:"block"}}><input type="radio" name={"q"+i} checked={answers[i]===j} onChange={()=>setAnswers(a=>({...a,[i]:j}))}/> {x}</label>)}</fieldset>)}<button onClick={()=>setDone(true)}>Check answers</button>{done&&<p role="status">Score: {score}/12</p>}</article>}
function TitleEffect(){useEffect(()=>{const old=document.title;document.title="Week 12.2 | Effects";return()=>{document.title=old}},[]);return null}function App(){return <><TitleEffect/><div className="grid"><Weather/><GitHubLookup/><Stopwatch/><PostList/></div><Quiz/></>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
