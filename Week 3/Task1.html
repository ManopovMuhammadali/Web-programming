
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdfa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            position: relative;
            width: 300px;
            padding: 25px;
            background: white;
            border-radius: 14px;
            border: 1px solid #d1e5df;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .badge {
            position: absolute;
            top: -12px;
            right: 15px;
            background: #dc2626;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        h2 {
            color: #0f766e;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            color: #dc2626;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">SALE</span>

        <h2>Wireless Headphones</h2>

        <p>High-quality sound with comfortable design.</p>

        <p class="price">$49.99</p>
        <p class="old-price">$79.99</p>
    </div>

</body>
</html>
