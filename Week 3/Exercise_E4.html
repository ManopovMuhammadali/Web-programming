
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables Theme</title>

    <style>
        :root {
            --primary: #0f766e;
            --accent: #14b8a6;
            --bg: #f0fdfa;
            --text: #1e293b;
            --card: #ffffff;
            --radius: 12px;
        }

        body.dark {
            --primary: #a78bfa;
            --accent: #8b5cf6;
            --bg: #111827;
            --text: #f9fafb;
            --card: #1f2937;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: background 0.3s, color 0.3s;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .card {
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 25px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Variables Theme</h1>

    <button class="btn" id="themeButton">
        Change Theme
    </button>

    <div class="card">
        <h2>My Themed Card</h2>
        <p>
            This card uses CSS custom properties
            for its background, text and border colors.
        </p>
    </div>

    <script>
        const themeButton = document.getElementById("themeButton");

        themeButton.addEventListener("click", function () {
            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {
                themeButton.textContent = "Switch to Light Theme";
            } else {
                themeButton.textContent = "Switch to Dark Theme";
            }
        });
    </script>

</body>
</html>
