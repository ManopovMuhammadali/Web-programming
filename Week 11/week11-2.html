<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 11.2 | React State</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font:16px/1.6 system-ui;margin:0;background:#f4f7f5;color:#1b2821}main{max-width:1000px;margin:auto;padding:2rem}header,section,article{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:1.2rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}button{padding:.55rem .8rem;margin:.2rem;border:0;border-radius:9px;background:#176b4d;color:white;cursor:pointer}input,select{padding:.55rem;border:1px solid #bccbc1;border-radius:8px}li{margin:.5rem 0}</style></head><body><main><nav><a href="index.html">← Week 11</a></nav><header><small>WEB PROGRAMMING · WEEK 11_2</small><h1>State, updates & shared data</h1><p>Practice state as the source of truth. Use functional updates and immutable array methods when state depends on prior state.</p></header><div id="root"></div><footer>Muhammadali Manopov · 202537299</footer></main><script type="text/babel">const{useState}=React;
function Counter(){const[count,setCount]=useState(0),[history,setHistory]=useState([]);function update(next){setHistory(h=>[...h,count]);setCount(next)}return <article><h2>Counter with undo</h2><p aria-live="polite">Count: <strong>{count}</strong></p><button onClick={()=>update(count+1)}>+1</button><button onClick={()=>update(count-1)}>−1</button><button onClick={()=>{if(history.length){setCount(history.at(-1));setHistory(h=>h.slice(0,-1))}}} disabled={!history.length}>Undo</button><button className="secondary" onClick={()=>{setCount(0);setHistory([])}}>Reset</button><p>History entries: {history.length}</p></article>}
function SharedScoreboard(){const[a,setA]=useState(0),[b,setB]=useState(0);return <article><h2>Shared scoreboard</h2><p>Team A {a} — {b} Team B</p><button onClick={()=>setA(s=>s+1)}>A scores</button><button onClick={()=>setB(s=>s+1)}>B scores</button><button className="secondary" onClick={()=>{setA(0);setB(0)}}>Reset match</button><p>Both score buttons update state owned by this parent component.</p></article>}
function TodoList(){const[items,setItems]=useState(()=>JSON.parse(localStorage.getItem("week11-todos")||"[]")),[text,setText]=useState(""),[query,setQuery]=useState(""),[filter,setFilter]=useState("all");function save(next){setItems(next);localStorage.setItem("week11-todos",JSON.stringify(next))}const visible=items.filter(x=>x.text.toLowerCase().includes(query.toLowerCase())&&(filter==="all"||(filter==="active"?!x.done:x.done)));return <article><h2>Todo list (saved in this browser)</h2><form onSubmit={e=>{e.preventDefault();if(text.trim())save([...items,{id:Date.now(),text:text.trim(),done:false}]);setText("")}}><input value={text} onChange={e=>setText(e.target.value)} placeholder="New task" aria-label="New task"/><button>Add task</button></form><p><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search tasks" aria-label="Search tasks"/> <select value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">All</option><option value="active">Active</option><option value="done">Done</option></select></p><ul>{visible.map(x=><li key={x.id}><label><input type="checkbox" checked={x.done} onChange={()=>save(items.map(t=>t.id===x.id?{...t,done:!t.done}:t))}/> {x.text}</label> <button className="secondary" onClick={()=>save(items.filter(t=>t.id!==x.id))}>Remove</button></li>)}</ul>{!visible.length&&<p>No matching tasks.</p>}</article>}
function WordCounter(){const[text,setText]=useState("");const words=text.trim()?text.trim().split(/\s+/).length:0;return <article><h2>Live word counter</h2><textarea rows="4" value={text} onChange={e=>setText(e.target.value)} aria-label="Text to count" placeholder="Type a sentence"/><p>Characters: {text.length} · Words: {words}</p></article>}
function App(){return <div className="grid"><Counter/><SharedScoreboard/><TodoList/><WordCounter/></div>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
