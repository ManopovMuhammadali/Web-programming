
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour Palette — Week 5 Exercise 04</title>
<link rel="stylesheet" href="../portfolio.css">

<style>
.palette-app {
  max-width: 900px;
  margin: 35px auto;
  padding: 25px;
  background: white;
  border: 1px solid #dbe3e5;
  border-radius: 12px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0;
}
.controls input { flex: 1; min-width: 180px; }
.controls button {
  padding: 10px 17px;
  background: #24434a;
  color: white;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
.palette-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 15px;
}
.color-card {
  min-height: 140px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  justify-content: end;
  cursor: pointer;
}
.color-card strong, .color-card small {
  width: fit-content;
  padding: 5px 8px;
  background: white;
  color: #17242b;
  border-radius: 4px;
}
.color-card small[hidden] { display: none; }
#message { min-height: 25px; }
</style>
</head>

<body>
<header class="site-nav">
  <a class="wordmark" href="../index.html">MM / PORTFOLIO</a>
  <a class="nav-link" href="index.html">← Week 5</a>
</header>

<main>
<header class="archive-intro">
  <p>WEEK 05 / EXERCISE 04</p>
  <h1>Interactive Colour Palette.</h1>
  <p>Add colours, reveal HEX codes, remove colours and export your palette.</p>
</header>

<section class="palette-app">
  <h2>My Colour Palette</h2>
  <p>Click a colour to reveal its HEX code. Double-click to remove it.</p>

  <div class="controls">
    <label for="colorInput">HEX colour</label>
    <input id="colorInput" type="text"
           placeholder="#ff5733" maxlength="7">
    <button id="addButton" type="button">Add Colour</button>
    <button id="exportButton" type="button">Export PNG</button>
  </div>

  <p id="message" role="status" aria-live="polite"></p>
  <div id="paletteGrid" class="palette-grid"></div>
</section>
</main>

<footer class="site-footer">
  <p>MM / Web Programming Portfolio</p>
  <a href="index.html">Back to Week 5</a>
</footer>

<script>
const input = document.getElementById("colorInput");
const grid = document.getElementById("paletteGrid");
const message = document.getElementById("message");
const KEY = "muhammadali-colour-palette";

function loadColors() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(saved) &&
        saved.every(c => typeof c === "string" &&
          /^#[0-9a-f]{6}$/i.test(c))) {
      return saved;
    }
  } catch (error) {
    console.error(error);
  }

  return ["#24434a", "#b87b35", "#e9dfd1", "#7b9e89"];
}

let colors = loadColors();

function saveColors() {
  try {
    localStorage.setItem(KEY, JSON.stringify(colors));
  } catch (error) {
    message.textContent = "Could not save colours.";
  }
}

function render() {
  grid.replaceChildren();

  if (!colors.length) {
    grid.textContent = "Your palette is empty.";
    return;
  }

  colors.forEach((color, index) => {
    const card = document.createElement("div");
    card.className = "color-card";
    card.style.backgroundColor = color;

    const title = document.createElement("strong");
    title.textContent = "Colour " + (index + 1);

    const hex = document.createElement("small");
    hex.textContent = color;
    hex.hidden = true;

    card.append(title, hex);

    card.addEventListener("click", () => {
      hex.hidden = !hex.hidden;
    });

    card.addEventListener("dblclick", () => {
      colors.splice(index, 1);
      saveColors();
      render();
      message.textContent = "Colour removed.";
    });

    grid.appendChild(card);
  });
}

function addColor() {
  const color = input.value.trim().toLowerCase();

  if (!/^#[0-9a-f]{6}$/i.test(color)) {
    message.textContent =
      "Enter a valid HEX colour, e.g. #ff5733.";
    return;
  }

  if (colors.includes(color)) {
    message.textContent = "Colour already exists.";
    return;
  }

  colors.push(color);
  saveColors();
  render();
  input.value = "";
  message.textContent = "Colour added successfully.";
}

function exportPNG() {
  if (!colors.length) {
    message.textContent = "Add a colour first.";
    return;
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const width = 300;
  const height = 140;
  const columns = 2;

  canvas.width = columns * width;
  canvas.height = Math.ceil(colors.length / columns) * height;

  colors.forEach((color, i) => {
    const x = (i % columns) * width;
    const y = Math.floor(i / columns) * height;

    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px Arial";
    ctx.fillText(color, x + 18, y + 75);
  });

  const link = document.createElement("a");
  link.download = "my-colour-palette.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  message.textContent = "PNG exported successfully.";
}

document.getElementById("addButton")
  .addEventListener("click", addColor);

document.getElementById("exportButton")
  .addEventListener("click", exportPNG);

input.addEventListener("keydown", e => {
  if (e.key === "Enter") addColor();
});

render();
</script>
</body>
</html>
