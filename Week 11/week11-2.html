<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Week 11.2 React state, events, controlled forms and browser storage exercises."><title>Week 11.2 | React State &amp; Events</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>:root{--ink:#18362c;--muted:#5b7168;--line:#d8e7df;--mint:#eaf6ef;--green:#176b4d;--paper:#f4f8f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{width:min(1050px,calc(100% - 32px));margin:auto;padding:24px 0 56px}a{color:var(--green)}.back{display:inline-block;margin:8px 0 18px;font-weight:700}header,.panel,article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,26px);margin:16px 0;box-shadow:0 8px 24px #18362c0a}header{background:linear-gradient(135deg,#e4f4e9,#fff 70%)}header small,.eyebrow{color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:.5rem 0}h2{font-size:1.3rem;margin:.1rem 0 .45rem}.lede,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:18px}article{margin:0;padding:18px;box-shadow:none}button{font:inherit;border:0;border-radius:10px;padding:.58rem .85rem;margin:.2rem;background:var(--green);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--mint);color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e3a532;outline-offset:3px}input,textarea,select{font:inherit;padding:.62rem .72rem;border:1px solid #b9cbc0;border-radius:9px;background:white;color:var(--ink);max-width:100%}label{font-weight:650}form{display:grid;gap:10px}form label{display:grid;gap:4px}textarea{width:100%;resize:vertical}li{margin:.5rem 0}.count{font-variant-numeric:tabular-nums}footer{text-align:center;color:var(--muted);padding:28px 0}</style></head><body><main><a class="back" href="index.html">← Week 11 overview</a><header><small>WEB PROGRAMMING · WEEK 11.2</small><h1>State, events &amp; browser storage</h1><p class="lede">Practice controlled updates, shared state, form events and persistent data. Each demo keeps React state as its source of truth.</p></header><div id="root"></div><footer>Muhammadali Manopov · 202537299</footer></main><script type="text/babel">const{useState}=React;
function Counter(){const[count,setCount]=useState(0),[history,setHistory]=useState([]);function update(next){setHistory(h=>[...h,count]);setCount(next)}function undo(){if(!history.length)return;setCount(history[history.length-1]);setHistory(h=>h.slice(0,-1))}return <article><h2>Counter with undo</h2><p aria-live="polite">Count: <strong className="count">{count}</strong></p><button onClick={()=>update(count+1)}>+1</button><button onClick={()=>update(count-1)}>−1</button><button className="secondary" onClick={undo} disabled={!history.length}>Undo</button><button className="secondary" onClick={()=>{setCount(0);setHistory([])}}>Reset</button><p className="muted">History entries: {history.length}. Functional state updates retain the previous value.</p></article>}
function SharedScoreboard(){const[a,setA]=useState(0),[b,setB]=useState(0);return <article><h2>Shared scoreboard</h2><p aria-live="polite">Team A <strong>{a}</strong> — <strong>{b}</strong> Team B</p><button onClick={()=>setA(s=>s+1)}>A scores</button><button onClick={()=>setB(s=>s+1)}>B scores</button><button className="secondary" onClick={()=>{setA(0);setB(0)}}>Reset match</button><p className="muted">Both child controls update state owned by this parent.</p></article>}
function TodoList(){const[items,setItems]=useState(()=>{try{return JSON.parse(localStorage.getItem("week11-todos")||"[]")}catch{return []}}),[text,setText]=useState(""),[query,setQuery]=useState(""),[filter,setFilter]=useState("all");function save(next){setItems(next);try{localStorage.setItem("week11-todos",JSON.stringify(next))}catch{}}const visible=items.filter(x=>x.text.toLowerCase().includes(query.toLowerCase())&&(filter==="all"||(filter==="active"?!x.done:x.done)));return <article><h2>Todo list · saved in this browser</h2><form onSubmit={e=>{e.preventDefault();const value=text.trim();if(value)save([...items,{id:crypto.randomUUID(),text:value,done:false}]);setText("")}}><label>New task<input value={text} onChange={e=>setText(e.target.value)} placeholder="For example, review props" required maxLength="80"/></label><button type="submit">Add task</button></form><div className="toolbar"><label>Search tasks <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search"/></label><label>Show <select value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">All</option><option value="active">Active</option><option value="done">Done</option></select></label></div><ul>{visible.map(x=><li key={x.id}><label><input type="checkbox" checked={x.done} onChange={()=>save(items.map(t=>t.id===x.id?{...t,done:!t.done}:t))}/> {x.text}</label> <button className="secondary" onClick={()=>save(items.filter(t=>t.id!==x.id))} aria-label={"Remove "+x.text}>Remove</button></li>)}</ul>{!visible.length&&<p className="muted">No matching tasks.</p>}<p className="muted">Changes are stored with localStorage and remain after refresh on this browser.</p></article>}
function ControlledForm(){const[values,setValues]=useState({name:"",email:"",message:""}),[sent,setSent]=useState(false);function change(e){setValues(v=>({...v,[e.target.name]:e.target.value}));setSent(false)}function submit(e){e.preventDefault();if(e.currentTarget.reportValidity())setSent(true)}return <article><h2>Controlled contact form</h2><p className="muted">React state mirrors each field; the submit handler validates and shows a local confirmation.</p><form onSubmit={submit}><label>Name<input name="name" value={values.name} onChange={change} autoComplete="name" required minLength="2"/></label><label>Email<input name="email" type="email" value={values.email} onChange={change} autoComplete="email" required/></label><label>Message<textarea name="message" value={values.message} onChange={change} rows="3" required minLength="10" maxLength="240"/></label><p aria-live="polite" className="muted">{values.message.length} / 240 characters</p><button type="submit">Preview submission</button></form>{sent&&<p role="status" className="status">Thanks, {values.name}. The form passed validation. No data was sent.</p>}</article>}
function WordCounter(){const[text,setText]=useState("");const words=text.trim()?text.trim().split(/\s+/).length:0;return <article><h2>Live word counter</h2><label>Text to count<textarea rows="4" value={text} onChange={e=>setText(e.target.value)} placeholder="Type a sentence"/></label><p aria-live="polite">Characters: {text.length} · Words: {words}</p></article>}
function App(){return <div className="grid"><Counter/><SharedScoreboard/><TodoList/><ControlledForm/><WordCounter/></div>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script></body></html>
